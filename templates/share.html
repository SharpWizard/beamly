<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FB">
<title>{{ app_name }} · {{ host }}</title>
<link rel="icon" href="/static/beamly.png"><link rel="apple-touch-icon" href="/static/beamly.png">
<link rel="stylesheet" href="/static/ui.css">
<script src="/static/icons.js"></script>
<style>
:root{--surface:rgba(255,255,255,.88);--solid:#fff;--soft:#F7F8FC;--line:#E5E8F1;--line2:#EEF0F6;--text:#121829;--muted:#67708A;--faint:#9AA2B6;--brand:#4F5BFF;--brand2:#8B5CF6;--brand-soft:#EEF0FF;--ok:#12A779;--ok-soft:#E4F7EF;--bad:#E5484D;--warn:#E08A00;
 --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.5,.5,1);--shadow:0 1px 2px rgba(18,24,41,.04),0 10px 28px -16px rgba(40,50,120,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.ic{width:20px;height:20px;flex:none}
.shell{max-width:980px;margin:0 auto}

/* header */
.hd{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;transition:background .3s,box-shadow .3s}
.hd.stuck{background:rgba(244,246,251,.82);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);box-shadow:0 8px 24px -18px rgba(40,50,120,.35)}
.hd-row{display:flex;align-items:center;gap:11px;animation:fadeIn .5s ease both}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px -8px rgba(79,91,255,.7)}
.logo .ic{width:23px;height:23px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:18px;letter-spacing:-.3px;font-weight:700}
.ttl small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;animation:pulse 2s infinite}
.dot.off{background:var(--warn);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,167,121,.5)}70%{box-shadow:0 0 0 7px rgba(18,167,121,0)}100%{box-shadow:0 0 0 0 rgba(18,167,121,0)}}
.iconbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--solid);border:1px solid var(--line);color:var(--muted);transition:transform .3s var(--spring),color .2s}
.iconbtn:active{transform:scale(.9)}
.iconbtn .ic{transition:transform .45s var(--spring)}
.iconbtn.spin-once .ic{transform:rotate(180deg)}
.search{margin-top:12px;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:15px;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow);transition:.25s var(--ease);animation:fadeIn .5s .05s ease both}
.search:focus-within{border-color:#B9C0FB;box-shadow:0 0 0 4px var(--brand-soft),var(--shadow)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0}
.search .ic{color:var(--faint);transition:color .2s}
.search:focus-within .ic{color:var(--brand)}
.crumbs{display:flex;align-items:center;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.crumbs::-webkit-scrollbar{display:none}
.crumb{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.2s;animation:fadeIn .35s ease both}
.crumb .ic{width:16px;height:16px}
.crumb.cur{color:var(--text);background:var(--solid);border:1px solid var(--line)}
.crumbs .sep{color:var(--faint);display:inline-flex}.crumbs .sep .ic{width:14px;height:14px}
.offline{display:none;margin-top:10px;align-items:center;gap:10px;padding:10px 14px;border-radius:13px;background:#FFF4DE;color:#8A5600;font-size:13.5px;font-weight:600;animation:fadeIn .3s ease both}
body.is-off .offline{display:flex}

/* content */
.content{padding:4px 16px 20px}
.stage.fwd{animation:slideL .42s var(--ease) both}
.stage.back{animation:slideR .42s var(--ease) both}
@keyframes slideL{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.sec{display:flex;align-items:center;gap:10px;margin:14px 2px 10px}
.sec h3{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:12px;background:var(--solid);border:1px solid var(--line);font-size:13.5px;font-weight:600;transition:transform .25s var(--spring)}
.chip:active{transform:scale(.94)}
.chip.brand{background:linear-gradient(135deg,var(--brand),#7457F8);border:0;color:#fff;box-shadow:0 8px 18px -10px rgba(79,91,255,.9)}
.chip .ic{width:17px;height:17px}

/* list */
.list{background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:11px 12px 11px 14px;border-bottom:1px solid var(--line2);min-height:68px;transition:background .2s}
.row:last-child{border:0}
.row:active{background:var(--brand-soft)}
.fi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden;position:relative;transition:transform .3s var(--spring)}
.row:active .fi{transform:scale(.92)}
.fi img,.th img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity .5s,transform .7s var(--ease)}
.fi img.ok,.th img.ok{opacity:1;transform:none}
.fi .ic{width:21px;height:21px}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.dl{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none;transition:transform .3s var(--spring),background .3s,color .3s}
.dl:active{transform:scale(.86)}
.dl .ic{width:19px;height:19px;stroke-width:2.1}
.dl.done{background:var(--ok-soft);color:var(--ok)}
.dl.done .ic{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.go{color:var(--faint);transition:transform .3s var(--spring)}
.row:active .go{transform:translateX(4px)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s var(--spring)}
.tile:active{transform:scale(.96)}
.tile .th{aspect-ratio:1/0.82;display:grid;place-items:center;position:relative;overflow:hidden}
.tile .th .ic{width:38px;height:38px;stroke-width:1.5}
.tile .play{position:absolute;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#E0445E;box-shadow:0 8px 20px -8px rgba(0,0,0,.3)}
.tile .play .ic{width:16px;height:16px;margin-left:2px}
.tile .tb{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px}
.tile .tb .meta b{font-size:13.5px}.tile .tb .meta small{font-size:11.5px}
.tile .dl{width:38px;height:38px;border-radius:11px}

/* hero */
.hero{position:relative;margin:4px 0;padding:18px;border-radius:22px;overflow:hidden;background:linear-gradient(120deg,#EEF0FF,#F6F0FF,#EAF8F4,#EEF0FF);background-size:300% 300%;animation:heroBg 12s ease infinite,rise .6s var(--ease) both;border:1px solid var(--line);display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
@keyframes heroBg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero .hi{width:50px;height:50px;border-radius:16px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--brand);flex:none;position:relative}
.hero .hi::after{content:"";position:absolute;inset:-1px;border-radius:16px;border:2px solid rgba(79,91,255,.35);animation:ringOut 2.4s ease-out infinite}
@keyframes ringOut{from{transform:scale(1);opacity:.9}to{transform:scale(1.6);opacity:0}}
.hero b{font-size:16px}.hero p{color:var(--muted);font-size:13px;margin-top:2px}
.empty{text-align:center;padding:52px 20px;color:var(--muted);animation:fadeIn .5s ease both}
.empty .ei{width:68px;height:68px;border-radius:22px;margin:0 auto 14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--brand);box-shadow:var(--shadow)}
.empty .ei .ic{width:30px;height:30px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.skel{height:68px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:13px;padding:0 14px}
.skel i{display:block;border-radius:10px;background:linear-gradient(90deg,#EEF0F6 0%,#F8F9FC 50%,#EEF0F6 100%);background-size:200% 100%;animation:sh 1.1s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* views */
.view{display:none}
.view.on{display:block;animation:fadeIn .4s var(--ease) both}
.pick{display:block;position:relative;border-radius:24px;padding:36px 18px;text-align:center;margin-top:8px;cursor:pointer;background:linear-gradient(180deg,rgba(250,251,255,.95),rgba(242,243,255,.95));border:2px dashed #C3CAF8;transition:transform .3s var(--spring),border-color .3s}
.pick:active{transform:scale(.97)}
.pick .pi{width:70px;height:70px;margin:0 auto 14px;border-radius:22px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;box-shadow:0 14px 30px -12px rgba(79,91,255,.8);animation:float 3s ease-in-out infinite}
.pick .pi .ic{width:30px;height:30px}
.pick b{font-size:17px;display:block}.pick p{color:var(--muted);font-size:13.5px;margin-top:4px}
.up{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.up:last-child{border:0}
.up .fi{width:42px;height:42px;border-radius:12px}
.bar{height:7px;border-radius:9px;background:var(--line2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .25s var(--ease);background:linear-gradient(90deg,var(--brand),var(--brand2));background-image:linear-gradient(135deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%),linear-gradient(90deg,var(--brand),var(--brand2));background-size:16px 16px,100% 100%;animation:stripes .6s linear infinite}
@keyframes stripes{to{background-position:16px 0,0 0}}
.up.done .bar i{background:var(--ok);animation:none}
.up.err .bar i{background:var(--bad);animation:none}
.st{font-size:12.5px;font-weight:700;color:var(--brand);min-width:44px;text-align:right;display:flex;justify-content:flex-end}
.up.done .st{color:var(--ok)}.up.done .st .ic{animation:pop .5s var(--spring)}
.up.err .st{color:var(--bad)}
.compose{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--shadow);margin-top:8px;transition:.25s}
.compose:focus-within{border-color:#B9C0FB;box-shadow:0 0 0 4px var(--brand-soft),var(--shadow)}
.compose textarea{width:100%;border:0;outline:0;resize:none;min-height:96px;padding:6px;font-size:15px;background:none}
.compose .row2{display:flex;justify-content:flex-end;gap:8px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;box-shadow:var(--shadow);overflow:hidden;transition:height .3s,opacity .3s,margin .3s,padding .3s}
.msg.leaving{height:0!important;opacity:0;margin-top:0;padding-top:0;padding-bottom:0;border-width:0}
.msg.pc{border-color:#DADFFF;background:linear-gradient(180deg,#F5F6FF,#fff)}
.msg .mh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.msg .mh .ic{width:16px;height:16px}
.msg pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:15px;margin-top:8px;line-height:1.45}
.msg a.lnk{color:var(--brand);text-decoration:underline}

/* bottom nav with sliding pill */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;width:min(440px,calc(100% - 24px));background:rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:22px;padding:6px;display:flex;box-shadow:0 18px 40px -18px rgba(40,50,120,.45);animation:navIn .7s .2s var(--spring) both}
@keyframes navIn{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
.nav .pillbg{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:16px;background:var(--brand-soft);transition:transform .5s var(--spring)}
.nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:16px;font-size:11.5px;font-weight:700;color:var(--faint);transition:color .3s}
.nav button .ic{width:22px;height:22px;transition:transform .4s var(--spring)}
.nav button.on{color:var(--brand)}
.nav button.on .ic{transform:translateY(-2px) scale(1.12)}
.nav .badge{position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none;animation:pop .5s var(--spring)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(244,246,251,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;flex-direction:column}
.lb.on{display:flex;animation:fadeIn .25s ease both}
.lb.closing{animation:lbOut .25s ease forwards}
@keyframes lbOut{to{opacity:0}}
.lb-h{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.lb-h .meta b{font-size:15px}
.lb-b{flex:1;display:grid;place-items:center;padding:8px;min-height:0;position:relative;overflow:hidden}
.lb-b > img,.lb-b > video,.lb-b > iframe,.lb-b > audio,.lb-b > .empty{animation:zoomIn .45s var(--ease) both}
@keyframes zoomIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.lb-b.sl > *:first-child{animation:slideL .35s var(--ease) both}
.lb-b.sr > *:first-child{animation:slideR .35s var(--ease) both}
.lb-b img,.lb-b video{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 24px 60px -24px rgba(18,24,41,.45);background:#fff}
.lb-b audio{width:min(520px,92vw)}
.lb-b iframe{width:100%;height:100%;border:0;border-radius:14px;background:#fff;box-shadow:var(--shadow)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);z-index:2;transition:transform .3s var(--spring)}
.lb-nav:active{transform:translateY(-50%) scale(.88)}
.lb-nav.p{left:10px}.lb-nav.n{right:10px}
.lb-f{display:flex;gap:10px;justify-content:center;padding:12px 16px calc(16px + env(safe-area-inset-bottom));animation:fadeIn .4s .1s ease both}
.lb-f .chip{height:48px;padding:0 22px;border-radius:15px;font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,24px) scale(.9);opacity:0;background:#fff;border:1px solid var(--line);color:var(--text);padding:10px 16px 10px 10px;border-radius:15px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;transition:transform .45s var(--spring),opacity .3s;pointer-events:none;z-index:80;max-width:calc(100% - 32px);box-shadow:0 18px 40px -16px rgba(40,50,120,.45)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .ti{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.toast .ti .ic{width:16px;height:16px}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:720px){.content{padding:4px 24px 24px}.hd{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
</style>
</head>
<body>
<script>document.write(auroraHtml)</script>
<div class="shell">
  <header class="hd" id="hd">
    <div class="hd-row">
      <div class="logo" id="logo"></div>
      <div class="ttl"><b>{{ app_name }}</b><small><span class="dot" id="dot"></span><span id="conn">Connected to {{ host }}</span></small></div>
      <button class="iconbtn rp" id="viewBtn" title="Change view"></button>
    </div>
    <div class="offline" id="offline"></div>
    <div id="filesHead">
      <label class="search"><span id="sIc"></span><input id="q" type="search" placeholder="Search in this folder" autocomplete="off"></label>
      <div class="crumbs" id="crumbs"></div>
    </div>
  </header>

  <main class="content">
    <section class="view on" id="v-files"><div class="stage" id="files"></div></section>

    <section class="view" id="v-send">
      <div class="sec"><h3>Send to PC</h3></div>
      <label class="pick rp" id="pick">
        <input type="file" id="fileIn" multiple hidden>
        <div class="pi" id="pickIc"></div>
        <b>Choose photos, videos or files</b>
        <p>They are saved straight to <span id="hostName">the PC</span></p>
      </label>
      <div id="upOff" class="empty" style="display:none"><div class="ei" id="lockIc"></div><b>Sending is turned off</b>The PC owner has disabled uploads.</div>
      <div class="sec" id="upHead" style="display:none"><h3>Transfers</h3><small id="upSum" style="color:var(--muted);font-weight:600;font-size:12.5px"></small></div>
      <div class="list" id="ups" style="display:none"></div>
    </section>

    <section class="view" id="v-clip">
      <div class="sec"><h3>Shared clipboard</h3></div>
      <div class="compose"><textarea id="msgText" placeholder="Type or paste text to send to the PC…"></textarea>
        <div class="row2"><button class="chip rp" id="pasteBtn"></button><button class="chip brand rp" id="sendBtn"></button></div></div>
      <div id="msgs"></div>
    </section>
  </main>
</div>

<nav class="nav" id="nav">
  <span class="pillbg" id="pillbg"></span>
  <button class="on" data-v="files"></button>
  <button data-v="send"></button>
  <button data-v="clip"></button>
</nav>

<div class="lb" id="lb">
  <div class="lb-h"><button class="iconbtn rp" id="lbClose"></button><div class="meta"><b id="lbName"></b><small id="lbInfo"></small></div></div>
  <div class="lb-b" id="lbBody"></div>
  <div class="lb-f"><a class="chip brand rp" id="lbDl"></a></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let INFO = {}, items = [], cur = { s: '', p: '' }, view = localStorage.getItem('beamly_view') || 'list', lbIndex = -1, depth = 0;
const VIEWS = ['files', 'send', 'clip'];

$('#logo').innerHTML = logoSvg();
$('#sIc').innerHTML = icon('search');
$('#pickIc').innerHTML = icon('upload');
$('#lockIc').innerHTML = icon('lock');
$('#lbClose').innerHTML = icon('back');
$('#pasteBtn').innerHTML = icon('clip') + 'Paste';
$('#sendBtn').innerHTML = icon('send') + 'Send to PC';
$('#offline').innerHTML = '<span class="spin"></span>Reconnecting to the PC…';
const NAV = { files: ['folder', 'Files'], send: ['upload', 'Send'], clip: ['clip', 'Clipboard'] };
document.querySelectorAll('.nav button').forEach(b => {
  b.innerHTML = icon(NAV[b.dataset.v][0]) + NAV[b.dataset.v][1] + (b.dataset.v === 'clip' ? '<span class="badge" id="msgBadge"></span>' : '');
  b.onclick = () => showView(b.dataset.v);
});
function showView(v) {
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#pillbg').style.transform = `translateX(${VIEWS.indexOf(v) * 100}%)`;
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  $('#filesHead').style.display = v === 'files' ? '' : 'none';
  $('#viewBtn').style.visibility = v === 'files' ? '' : 'hidden';
  if (v === 'clip') { $('#msgBadge').style.display = 'none'; loadMsgs(); }
  window.scrollTo({ top: 0 });
}
function setViewBtn() { $('#viewBtn').innerHTML = icon(view === 'list' ? 'grid' : 'list'); }
$('#viewBtn').onclick = () => {
  view = view === 'list' ? 'grid' : 'list'; localStorage.setItem('beamly_view', view);
  $('#viewBtn').classList.add('spin-once'); setTimeout(() => { setViewBtn(); $('#viewBtn').classList.remove('spin-once'); }, 220);
  draw(true);
};
setViewBtn();
window.addEventListener('scroll', () => $('#hd').classList.toggle('stuck', scrollY > 4), { passive: true });

function toast(m, ic, color) {
  const t = $('#toast'); const [bg, fg] = color || ['#E4F7EF', '#12A779'];
  t.innerHTML = `<div class="ti" style="background:${bg};color:${fg}">${icon(ic || 'check')}</div><span>${esc(m)}</span>`;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const relOf = e => cur.s ? (cur.p ? cur.p + '/' : '') + e.name : e.name;
const sidOf = e => cur.s || e.id;
const fileUrl = (e, extra) => '/f/' + sidOf(e) + '/' + enc(relOf(e)) + (extra || '');
const thumbUrl = e => '/t/' + sidOf(e) + '/' + enc(relOf(e));
const zipUrl = () => '/z/' + cur.s + '/' + enc(cur.p);

// ---------- connection ----------
let failures = 0;
function setOnline(ok) {
  failures = ok ? 0 : failures + 1;
  const off = failures >= 2;
  document.body.classList.toggle('is-off', off);
  $('#dot').classList.toggle('off', off);
  $('#conn').textContent = off ? 'Connection lost' : 'Connected to ' + (INFO.host || '{{ host }}');
}
async function getJSON(url) {
  try { const r = await fetch(url, { cache: 'no-store' }); setOnline(true); if (r.status === 401) { location.reload(); return null; } return r.ok ? r.json() : { _err: r.status }; }
  catch (e) { setOnline(false); return null; }
}

// ---------- files ----------
async function load(s, p, push = true, dir = 'fwd') {
  cur = { s: s || '', p: p || '' };
  if (push) history.pushState(cur, '', '#' + (cur.s ? cur.s + '/' + cur.p : ''));
  $('#q').value = '';
  const st = $('#files');
  st.innerHTML = '<div class="list">' + Array.from({ length: 5 }, () => '<div class="skel"><i style="width:46px;height:46px;border-radius:14px"></i><div style="flex:1"><i style="height:12px;width:60%"></i><i style="height:10px;width:35%;margin-top:8px"></i></div></div>').join('') + '</div>';
  const d = await getJSON('/api/list?s=' + encodeURIComponent(cur.s) + '&p=' + encodeURIComponent(cur.p));
  if (!d) { st.innerHTML = emptyHtml('wifi', 'Cannot reach the PC', 'Check that you are on the same Wi-Fi and Beamly is open.'); return; }
  if (d._err) { st.innerHTML = emptyHtml('info', 'Not available', 'This item is no longer shared.'); drawCrumbs([]); return; }
  items = d.items;
  drawCrumbs(d.crumbs);
  st.classList.remove('fwd', 'back'); void st.offsetWidth; if (dir) st.classList.add(dir);
  draw();
  window.scrollTo({ top: 0 });
}
function drawCrumbs(crumbs) {
  const all = [{ name: 'Home', home: true, p: '' }].concat(crumbs);
  $('#crumbs').innerHTML = all.map((c, i) => (i ? `<span class="sep">${icon('chevron')}</span>` : '') +
    `<button class="crumb ${i === all.length - 1 ? 'cur' : ''}" data-ci="${i}" style="animation-delay:${i * 40}ms">${c.home ? icon('home') : ''}${esc(c.name)}</button>`).join('');
  $('#crumbs').querySelectorAll('.crumb').forEach(b => b.onclick = () => {
    const c = all[+b.dataset.ci]; if (+b.dataset.ci === all.length - 1) return;
    c.home ? load('', '', true, 'back') : load(cur.s, c.p, true, 'back');
  });
  setTimeout(() => { const el = $('#crumbs'); el.scrollTo({ left: el.scrollWidth, behavior: 'smooth' }); }, 0);
}
const emptyHtml = (ic, t, s) => `<div class="empty"><div class="ei float">${icon(ic)}</div><b>${t}</b>${s}</div>`;
function sub(e) {
  if (e.dir) return e.count != null ? `${e.count} item${e.count === 1 ? '' : 's'}${e.size ? ' · ' + humanSize(e.size) : ''}` : 'Folder';
  return humanSize(e.size) + ' · ' + new Date(e.mtime * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}
function thumbHtml(e, big) {
  const k = fileKind(e); const [bg, fg] = KIND_COLORS[k];
  if (k === 'image' && INFO.thumbs && !['svg', 'heic', 'heif'].includes(e.ext))
    return { bg, fg, html: `<img loading="lazy" src="${thumbUrl(e)}" onload="this.classList.add('ok')" onerror="this.outerHTML=icon('image')">` };
  return { bg, fg, html: icon(k) + (big && k === 'video' ? `<span class="play">${icon('play')}</span>` : '') };
}
function draw(animate) {
  const q = $('#q').value.trim().toLowerCase();
  const list = items.map((e, i) => ({ e, i })).filter(x => !q || x.e.name.toLowerCase().includes(q));
  let head = '';
  if (!cur.s) {
    head = `<div class="hero"><div class="hi">${icon('wifi')}</div><div><b>Files shared from ${esc(INFO.host || 'PC')}</b><p>Tap to preview · tap the arrow to download</p></div></div>`;
    if (items.length) head += `<div class="sec"><h3>${items.length} shared item${items.length > 1 ? 's' : ''}</h3></div>`;
  } else {
    const folders = items.filter(e => e.dir).length, files = items.length - folders;
    const parts = [folders && folders + ' folder' + (folders > 1 ? 's' : ''), files && files + ' file' + (files > 1 ? 's' : '')].filter(Boolean);
    head = `<div class="sec"><h3>${parts.join(' · ') || 'Empty folder'}</h3>${items.length ? `<a class="chip rp" href="${zipUrl()}" onclick="toast('Preparing ZIP download…','zip',['#FFF1E6','#D9731A'])">${icon('zip')}Download all</a>` : ''}</div>`;
  }
  const st = $('#files');
  if (!items.length) { st.innerHTML = head + (cur.s ? emptyHtml('folder', 'This folder is empty', '') : emptyHtml('sparkle', 'Nothing shared yet', 'Ask the PC owner to add files in Beamly.')); return; }
  if (!list.length) { st.innerHTML = head + emptyHtml('search', 'No matches', 'Try a different search.'); return; }
  const anim = (i) => q && !animate ? '' : `rise" style="--i:${i}`;
  let body;
  if (view === 'grid') {
    body = '<div class="grid">' + list.map(({ e, i }, n) => {
      const t = thumbHtml(e, true);
      return `<div class="tile ${anim(n)}"><div class="th" style="background:${t.bg};color:${t.fg}" data-open="${i}">${t.html}</div>
        <div class="tb"><div class="meta" data-open="${i}"><b>${esc(e.name)}</b><small>${sub(e)}</small></div>
        ${e.dir ? '' : `<a class="dl rp" href="${fileUrl(e, '?dl=1')}" download data-dl="${i}">${icon('download')}</a>`}</div></div>`;
    }).join('') + '</div>';
  } else {
    body = '<div class="list">' + list.map(({ e, i }, n) => {
      const t = thumbHtml(e);
      return `<div class="row ${anim(n)}" data-open="${i}"><div class="fi" style="background:${t.bg};color:${t.fg}">${t.html}</div>
        <div class="meta"><b>${esc(e.name)}</b><small>${sub(e)}</small></div>
        ${e.dir ? `<span class="go">${icon('chevron')}</span>` : `<a class="dl rp" href="${fileUrl(e, '?dl=1')}" download data-dl="${i}" aria-label="Download">${icon('download')}</a>`}</div>`;
    }).join('') + '</div>';
  }
  st.innerHTML = head + body;
}
$('#q').oninput = () => draw();
$('#files').addEventListener('click', e => {
  const dl = e.target.closest('[data-dl]');
  if (dl) {
    toast('Downloading ' + items[+dl.dataset.dl].name, 'download', ['#EEF0FF', '#4F5BFF']);
    dl.classList.add('done'); dl.innerHTML = icon('check');
    setTimeout(() => { dl.classList.remove('done'); dl.innerHTML = icon('download'); }, 2200);
    return;
  }
  const o = e.target.closest('[data-open]'); if (o) openItem(+o.dataset.open);
});

function openItem(i) {
  const e = items[i];
  if (e.dir) return cur.s ? load(cur.s, (cur.p ? cur.p + '/' : '') + e.name) : load(e.id, '');
  openLightbox(i);
}
const previewable = e => ['image', 'video', 'music', 'pdf'].includes(fileKind(e)) || ['txt', 'md', 'json', 'csv', 'log'].includes(e.ext);
function openLightbox(i, dir) {
  const e = items[i]; lbIndex = i;
  const k = fileKind(e), src = fileUrl(e, '?pv=1');
  $('#lbName').textContent = e.name;
  $('#lbInfo').textContent = humanSize(e.size) + ' · ' + (e.mime || 'file');
  $('#lbDl').href = fileUrl(e, '?dl=1'); $('#lbDl').setAttribute('download', ''); $('#lbDl').innerHTML = icon('download') + 'Download';
  let html;
  if (!previewable(e)) { const [bg, fg] = KIND_COLORS[k]; html = `<div class="empty"><div class="ei" style="background:${bg};color:${fg};border:0">${icon(k)}</div><b>${esc(e.name)}</b>No preview for this file type — download it instead.</div>`; }
  else if (k === 'image') html = `<img src="${src}" alt="">`;
  else if (k === 'video') html = `<video src="${src}" controls autoplay playsinline></video>`;
  else if (k === 'music') html = `<audio src="${src}" controls autoplay></audio>`;
  else html = `<iframe src="${src}"></iframe>`;
  const media = items.map((x, j) => ({ x, j })).filter(o => !o.x.dir && previewable(o.x));
  const pos = media.findIndex(o => o.j === i);
  if (pos > 0) html += `<button class="lb-nav p rp" data-j="${media[pos - 1].j}" data-d="sr">${icon('back')}</button>`;
  if (pos >= 0 && pos < media.length - 1) html += `<button class="lb-nav n rp" data-j="${media[pos + 1].j}" data-d="sl">${icon('chevron')}</button>`;
  const body = $('#lbBody');
  body.className = 'lb-b' + (dir ? ' ' + dir : '');
  body.innerHTML = html;
  if (!$('#lb').classList.contains('on')) { $('#lb').classList.remove('closing'); $('#lb').classList.add('on'); history.pushState({ ...cur, lb: 1 }, '', location.hash); }
}
$('#lbBody').addEventListener('click', e => { const b = e.target.closest('.lb-nav'); if (b) openLightbox(+b.dataset.j, b.dataset.d); });
$('#lbDl').onclick = () => toast('Download started', 'download', ['#EEF0FF', '#4F5BFF']);
function closeLb() {
  const lb = $('#lb'); lb.classList.add('closing');
  setTimeout(() => { lb.classList.remove('on', 'closing'); $('#lbBody').innerHTML = ''; }, 240);
}
$('#lbClose').onclick = () => history.back();
document.addEventListener('keydown', e => {
  if (!$('#lb').classList.contains('on')) return;
  if (e.key === 'Escape') history.back();
  if (e.key === 'ArrowRight') { const b = $('.lb-nav.n'); b && b.click(); }
  if (e.key === 'ArrowLeft') { const b = $('.lb-nav.p'); b && b.click(); }
});
let tx = null;
$('#lbBody').addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
$('#lbBody').addEventListener('touchend', e => {
  if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) { const b = document.querySelector(dx < 0 ? '.lb-nav.n' : '.lb-nav.p'); b && b.click(); }
});
window.onpopstate = ev => {
  if ($('#lb').classList.contains('on')) return closeLb();
  const st = ev.state || { s: '', p: '' };
  const goingUp = (st.p || '').length < cur.p.length || (!st.s && cur.s);
  load(st.s, st.p, false, goingUp ? 'back' : 'fwd');
};

// ---------- upload ----------
let upTotal = 0, upDone = 0;
$('#fileIn').onchange = () => { [...$('#fileIn').files].forEach(uploadOne); $('#fileIn').value = ''; };
function upSummary() { $('#upSum').textContent = upDone + ' of ' + upTotal + ' done'; }
function uploadOne(file) {
  $('#ups').style.display = ''; $('#upHead').style.display = '';
  upTotal++; upSummary();
  const el = document.createElement('div'); el.className = 'up enter';
  const k = fileKind({ ext: file.name.split('.').pop() }); const [bg, fg] = KIND_COLORS[k];
  el.innerHTML = `<div class="fi" style="background:${bg};color:${fg}">${icon(k)}</div><div class="meta"><b>${esc(file.name)}</b><small>${humanSize(file.size)}</small><div class="bar"><i></i></div></div><span class="st">0%</span>`;
  if (k === 'image') { const url = URL.createObjectURL(file); el.querySelector('.fi').innerHTML = `<img src="${url}" onload="this.classList.add('ok')">`; }
  $('#ups').prepend(el);
  const fd = new FormData(); fd.append('files', file, file.name);
  const x = new XMLHttpRequest(); x.open('POST', '/api/upload');
  const t0 = Date.now();
  x.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const p = Math.round(e.loaded / e.total * 100), secs = (Date.now() - t0) / 1000;
    el.querySelector('i').style.width = p + '%'; el.querySelector('.st').textContent = p + '%';
    if (secs > .5) el.querySelector('small').textContent = humanSize(e.loaded) + ' of ' + humanSize(e.total) + ' · ' + humanSize(e.loaded / secs) + '/s';
  };
  x.onload = () => {
    const ok = x.status === 200; el.classList.add(ok ? 'done' : 'err');
    el.querySelector('i').style.width = '100%';
    el.querySelector('.st').innerHTML = ok ? icon('check') : 'Failed';
    el.querySelector('small').textContent = ok ? humanSize(file.size) + ' · saved on the PC' : (x.status === 403 ? 'Uploads are turned off' : 'Upload failed');
    if (ok) { upDone++; upSummary(); toast('Sent ' + file.name); }
  };
  x.onerror = () => { el.classList.add('err'); el.querySelector('.st').textContent = 'Failed'; el.querySelector('small').textContent = 'Connection lost'; };
  x.send(fd);
}

// ---------- clipboard ----------
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a class="lnk" href="$1" target="_blank" rel="noopener">$1</a>');
let MSGS = [], newestSeen = localStorage.getItem('beamly_seen') || '';
async function loadMsgs() {
  const d = await getJSON('/api/messages'); if (!d || d._err) return;
  MSGS = d.items;
  keyed($('#msgs'), MSGS, m => m.id, m => `<div class="msg ${m.pc ? 'pc' : ''}"><div class="mh">${icon(m.pc ? 'laptop' : 'phone')}<b style="color:var(--text)">${esc(m.from)}</b>· <span data-ago="${m.t}"></span><span style="flex:1"></span>
      <button class="chip rp" style="height:34px" data-copy="${m.id}">${icon('copy')}Copy</button></div><pre>${linkify(m.text)}</pre></div>`,
    emptyHtml('clip', 'No snippets yet', 'Text sent from the PC shows up here.'));
  tickAgo();
  const top = MSGS[0];
  const onClip = $('#v-clip').classList.contains('on');
  if (top && top.pc && top.id !== newestSeen && !onClip) { $('#msgBadge').style.display = 'block'; }
  if (onClip && top) { newestSeen = top.id; localStorage.setItem('beamly_seen', top.id); }
}
$('#msgs').addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) { const m = MSGS.find(x => x.id === b.dataset.copy); m && copyText(m.text); } });
function copyText(t) {
  const done = () => toast('Copied', 'copy', ['#EEF0FF', '#4F5BFF']);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done);
  else { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = 0; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
}
$('#sendBtn').onclick = async () => {
  const t = $('#msgText').value.trim(); if (!t) { $('#msgText').focus(); return; }
  try {
    await fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t }) });
    $('#msgText').value = ''; toast('Sent to PC', 'send', ['#EEF0FF', '#4F5BFF']); loadMsgs();
  } catch (e) { toast('Could not send — check Wi-Fi', 'info', ['#FDECEC', '#E5484D']); }
};
$('#pasteBtn').onclick = async () => { try { $('#msgText').value = await navigator.clipboard.readText(); } catch (e) { $('#msgText').focus(); toast('Long-press the box to paste', 'clip', ['#EEF0FF', '#4F5BFF']); } };

// ---------- boot ----------
(async () => {
  INFO = (await getJSON('/api/info')) || {};
  if (INFO.host) { $('#hostName').textContent = INFO.host; setOnline(true); }
  $('#pick').style.display = INFO.allow_upload ? '' : 'none';
  $('#upOff').style.display = INFO.allow_upload ? 'none' : '';
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) { const i = h.indexOf('/'); const s = i < 0 ? h : h.slice(0, i), p = i < 0 ? '' : h.slice(i + 1); history.replaceState({ s, p }, '', location.hash); load(s, p, false, 'fwd'); }
  else { history.replaceState({ s: '', p: '' }, '', location.pathname); load('', '', false, null); }
  loadMsgs(); setInterval(loadMsgs, 4000);
  // keep the home screen and upload permission in sync with the PC
  setInterval(async () => {
    if (document.visibilityState !== 'visible') return;
    const inf = await getJSON('/api/info'); if (inf && !inf._err) {
      INFO = inf; $('#pick').style.display = INFO.allow_upload ? '' : 'none'; $('#upOff').style.display = INFO.allow_upload ? 'none' : '';
    }
    if (cur.s === '' && !$('#q').value && $('#v-files').classList.contains('on')) {
      const d = await getJSON('/api/list'); if (d && !d._err && JSON.stringify(d.items.map(x => x.id)) !== JSON.stringify(items.map(x => x.id))) { items = d.items; draw(true); }
    }
  }, 5000);
})();
</script>
</body>
